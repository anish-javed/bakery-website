<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track Order | Crumbs &amp; Co.</title>
  <meta name="description" content="Follow your Crumbs & Co. order from the oven to your door.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%81%3C/text%3E%3C/svg%3E">
</head>
<body data-page="track">

<main>
  <div class="container page-head center">
    <span class="hand">Where are my treats?</span>
    <h1 style="font-size:clamp(2rem,5vw,3rem)">Track your order</h1>
    <p style="margin-left:auto;margin-right:auto">Type the phone number you used when ordering. Add your order number to see just that one order.</p>
  </div>

  <div class="container track-box" style="padding-bottom:30px">
    <form class="panel" id="track-form" novalidate>
      <div class="row two">
        <div class="field">
          <label for="phone">Phone number</label>
          <input id="phone" type="tel" inputmode="numeric" placeholder="03XX-XXXXXXX" autocomplete="tel-national" maxlength="12">
          <div class="err">Please type your mobile number like 0300-1234567.</div>
        </div>
        <div class="field">
          <label for="no">Order number <span class="muted" style="font-weight:700">(optional)</span></label>
          <input id="no" type="text" placeholder="CC-1001" autocomplete="off" autocapitalize="characters" maxlength="14">
          <div class="err">Please type the order number like CC-1001, or leave it empty.</div>
        </div>
      </div>
      <button class="btn btn-rose btn-block" id="go" type="submit">Track my order</button>
    </form>

    <div id="track-msg" aria-live="polite"></div>
    <div id="track-result" hidden></div>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/art.js"></script>
<script src="js/store.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/track.js"></script>
</body>
</html>
